[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "php2shell-check"
version = "0.1.0"
description = "Defensive checker for PHP2Shell (CVE-2026-109618, CVE-2026-109619). No exploits."
license = {text = "MIT"}
requires-python = ">=3.8"

[project.scripts]
php2shell-check = "php2shell_check.cli:main"

[tool.setuptools]
packages = ["php2shell_check"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
